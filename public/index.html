<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My DevOps Deployment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #111827, #1e3a8a);
    }

    .card {
      width: min(90%, 600px);
      padding: 48px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-top: 0;
      font-size: 42px;
    }

    p {
      color: #dbeafe;
      font-size: 18px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      color: #111827;
      font-weight: bold;
      text-decoration: none;
      background: #60a5fa;
      border-radius: 10px;
    }

    a:hover {
      background: #93c5fd;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Deployment Successful 🚀</h1>

    <p>
      This website is running on Node.js and Express,
      deployed on AWS EC2, managed by PM2, and served
      through an Nginx reverse proxy.
    </p>

    <a href="/health">Check application health</a>
  </main>
</body>
<footer>
  Built by Rizwan with Node.js, AWS, caffeine, and suspicious amounts of confidence.
</footer>
</html>
